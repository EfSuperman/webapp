<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROHAN.DEV — LIVE GAME</title>
    <style>
        :root {
            --accent-neon-blue: #00f0ff;
            --accent-neon-pink: #ff00ff;
            --bg-color: #050508;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Space Mono', monospace, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #101015 0%, #050508 100%);
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.15);
            border: 1px solid rgba(0, 240, 255, 0.2);
            image-rendering: pixelated;
        }

        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .score-label {
            font-size: 1.5rem;
            color: var(--accent-neon-blue);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
            font-weight: 900;
        }

        #game-over-screen {
            position: absolute;
            inset: 0;
            background: rgba(5, 5, 8, 0.9);
            backdrop-filter: blur(10px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            color: var(--accent-neon-pink);
            text-shadow: 0 0 20px var(--accent-neon-pink);
        }

        .final-score {
            font-size: 1.2rem;
            margin: 1rem 0 2.5rem;
            color: var(--accent-neon-blue);
        }

        button {
            background: transparent;
            border: 1px solid var(--accent-neon-blue);
            color: var(--accent-neon-blue);
            padding: 12px 30px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        button:hover {
            background: var(--accent-neon-blue);
            color: #000;
            box-shadow: 0 0 25px var(--accent-neon-blue);
        }

        /* Mobile Controls Hint */
        #mobile-hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.3);
            font-size: 0.8rem;
            text-transform: uppercase;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="game-container">
        <div id="ui-overlay">
            <div class="score-label">XP: <span id="current-score">0000</span></div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="game-over-screen">
            <h1 id="status-title">SYSTEM FAILURE</h1>
            <div class="final-score">FINAL DATA COLLECTED: <span id="final-score-val">0</span></div>
            <button onclick="restartGame()">REBOOT SYSTEM</button>
        </div>

        <div id="mobile-hint" class="hint-text">
            TOUCH TO NAVIGATE / SPACE TO JUMP
        </div>
    </div>

    <script type="module">
        const canvas = document.getElementById('gameCanvas');
        const scoreEl = document.getElementById('current-score');
        const finalScoreEl = document.getElementById('final-score-val');
        const statusTitle = document.getElementById('status-title');
        const gameOverScreen = document.getElementById('game-over-screen');
        const uiOverlay = document.getElementById('ui-overlay');
        const mobileHint = document.getElementById('mobile-hint');
        
        let currentGame = null;
        let gameClass = null;

        // Configuration mapping
        const gameConfig = {
            snakeGame: { script: './scripts/snakeGame.js', className: 'SnakeGame', width: 600, height: 400 },
            cyberDash: { script: './scripts/cyberDash.js', className: 'CyberDash', width: 800, height: 400 },
            circuitFixer: { script: './scripts/circuitFixer.js', className: 'CircuitFixer', width: 600, height: 600 }
        };

        const params = new URLSearchParams(window.location.search);
        const isPreview = params.get('mode') === 'preview';

        if (isPreview) {
            uiOverlay.style.display = 'none';
            mobileHint.style.display = 'none';
        }

        async function init() {
            const gameKey = params.get('game') || 'snakeGame';
            const config = gameConfig[gameKey];

            if (!config) {
                statusTitle.innerText = "LINK CORRUPTED";
                gameOverScreen.style.display = 'flex';
                return;
            }

            // Set canvas size
            canvas.width = config.width;
            canvas.height = config.height;

            try {
                const module = await import(config.script);
                gameClass = module[config.className];
                
                startGame();
            } catch (err) {
                console.error("Game Loader Error:", err);
                statusTitle.innerText = "INIT ERROR";
                gameOverScreen.style.display = 'flex';
            }
        }

        function startGame() {
            gameOverScreen.style.display = 'none';
            scoreEl.innerText = "0000";
            
            currentGame = new gameClass(canvas, updateScore, onGameOver);
            currentGame.start();

            if (isPreview) {
                // Keep game running in preview without pause overlay
            }
        }

        window.restartGame = () => {
            if (currentGame && currentGame.stop) currentGame.stop();
            startGame();
        };

        function updateScore(score) {
            scoreEl.innerText = score.toString().padStart(4, '0');
        }

        function onGameOver(score, isWin = false) {
            if (isPreview) return; // Ignore death in preview
            statusTitle.innerText = isWin ? "CIRCUIT SYNCED" : "SYSTEM FAILURE";
            statusTitle.style.color = isWin ? "var(--accent-neon-blue)" : "var(--accent-neon-pink)";
            statusTitle.style.textShadow = isWin ? "0 0 20px var(--accent-neon-blue)" : "0 0 20px var(--accent-neon-pink)";
            
            finalScoreEl.innerText = score;
            gameOverScreen.style.display = 'flex';
        }

        init();
    </script>
</body>
</html>
